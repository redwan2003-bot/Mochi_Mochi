; ============================================================================
; Mochi Bot V1 - Milestone 0 PlatformIO Configuration
; Target: ESP32-S3 SuperMini (Nologo-style)
; Platform: espressif32 @ 6.6.0 (Arduino Core 2.0.14 / ESP-IDF 4.4.7)
; ============================================================================
;
; PROVISIONAL HARDWARE CHOICES (To be verified on physical board in M0):
; - board: esp32-s3-devkitc-1 baseline with SuperMini overrides
; - flash_size: 4MB provisional default for compact SuperMini modules
; - flash_mode: dio provisional safe mode (prevents QIO bootloops if DIO routed)
; - PSRAM: Disabled by default until verified via chip markings / runtime probe
; ============================================================================

[env:esp32-s3-supermini]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; Provisional Flash overrides for ESP32-S3 SuperMini (prevents 8MB header mismatch)
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default.csv

; Native USB CDC configuration on GPIO19 (D-) and GPIO20 (D+)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Serial monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Pinned exact library dependencies
lib_deps =
    olikraus/U8g2 @ 2.35.9
    h2zero/NimBLE-Arduino @ 1.4.1
    bblanchon/ArduinoJson @ 7.0.4
