; ============================================================================
; Mochi Bot V1 - Dual-Target PlatformIO Configuration
; Target 1: ESP32-S3 SuperMini (Xtensa Dual-Core, Arduino Core 2.0.14 / ESP-IDF 4.4.7)
; Target 2: ESP32-C6 SuperMini (RISC-V Single-Core, Arduino Core 3.x / ESP-IDF 5.x)
; ============================================================================

[platformio]
default_envs = esp32-s3-supermini, esp32-c6-supermini
; Short core directory to bypass Windows 260-char MAX_PATH limitation
core_dir = E:\pio

; ----------------------------------------------------------------------------
; Common Configuration Shared Across Targets
; ----------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Common 4MB Flash / DIO geometry for compact SuperMini modules
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv

; ----------------------------------------------------------------------------
; Target: ESP32-S3 SuperMini (Nologo-style Baseline Target)
; ----------------------------------------------------------------------------
[env:esp32-s3-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1

; Native USB CDC on GPIO19 (D-) and GPIO20 (D+)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DMOCHI_TARGET_ESP32S3=1

; Library dependencies for Arduino 3.x / ESP-IDF 5.x
lib_deps =
    olikraus/U8g2 @ 2.35.9
    h2zero/NimBLE-Arduino @ ^2.1.3
    bblanchon/ArduinoJson @ 7.0.4

; ----------------------------------------------------------------------------
; Target: ESP32-C6 SuperMini (Community Platform with Arduino Core 3.x)
; ----------------------------------------------------------------------------
[env:esp32-c6-supermini]
; pioarduino fork provides Arduino-ESP32 3.x / ESP-IDF 5.x required for ESP32-C6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-c6-devkitm-1

; Native USB Serial/JTAG on GPIO12 (D-) and GPIO13 (D+)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DMOCHI_TARGET_ESP32C6=1

; Library dependencies for Arduino 3.x / ESP-IDF 5.x (NimBLE 2.x required)
lib_deps =
    olikraus/U8g2 @ 2.35.9
    h2zero/NimBLE-Arduino @ ^2.1.3
    bblanchon/ArduinoJson @ 7.0.4
